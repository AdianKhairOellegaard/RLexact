name: PR — Matrix Build & Run

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-run:
    name: Build & Run (${{ matrix.os }} )
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
        include:
          - os: ubuntu-22.04
            shell: bash
          - os: macos-14
            shell: bash

    env:
      MAKE_TARGET: "RLexact.out"
      EXECUTABLE_PATH: "src/RLexact.out"
      EXEC_ARGS: "./RLexamples/test/test.h"
      RUN_LAUNCHER: ""
      CXX_STD: "-std=c++17"
      WARNINGS: "-Wall -Wextra -Wpedantic"
      EXAMPLES_ROOT: "RLexamples"
      HEADER_GLOB: "**/*.h"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------- Linux setup ----------------
      - name: Install build dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential make clang pkg-config
          sudo apt-get install -y openmpi-bin libopenmpi-dev

      # ---------------- macOS setup ----------------
      - name: Install build dependencies (macOS)
        if: matrix.os == 'macos-14'
        run: |
          set -euxo pipefail
          brew update
          brew install llvm make
          brew install open-mpi

      - name: Show toolchain versions
        shell: bash
        run: |
          set -euxo pipefail
          echo "Compiler versions:"
          c++ --version || true
          clang --version || true
          which mpic++ || true
          mpic++ --version || true
          echo "Make:"
          make --version

      - name: Build with make
        shell: bash
        env:
          CXXFLAGS: "${{ env.CXX_STD }} ${{ env.WARNINGS }}"
        run: |
          set -euxo pipefail
          echo "Running make ${MAKE_TARGET}"
          cd src
          make ${MAKE_TARGET} 2>&1 | tee build-${{ matrix.os }}.log

      - name: List build outputs
        shell: bash
        run: |
          set -euxo pipefail
          ls -lah
          if [ -f "${EXECUTABLE_PATH}" ]; then
            file "${EXECUTABLE_PATH}" || true
          fi

      - name: Show shared library deps (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          set -euxo pipefail
          if [ -f "${EXECUTABLE_PATH}" ]; then
            ldd "${EXECUTABLE_PATH}" || true
          fi

      - name: Show shared library deps (macOS)
        if: matrix.os == 'macos-14'
        run: |
          set -euxo pipefail
          if [ -f "${EXECUTABLE_PATH}" ]; then
            otool -L "${EXECUTABLE_PATH}" || true
          fi
      - name: Run executable for each example header (all) + verify outputs (macOS only)
        shell: bash
        env:
          EXAMPLES_ROOT: "RLexamples"
          HEADER_GLOB: "*.h"  # pattern used by find -name
        run: |
          set -euo pipefail

          if [ ! -x "${EXECUTABLE_PATH}" ]; then
            echo "Executable not found or not executable: ${EXECUTABLE_PATH}"
            exit 1
          fi

          # Find all headers (adjust -mindepth if you want to exclude top-level headers)
          find "${EXAMPLES_ROOT}" -type f -name "${HEADER_GLOB}" ! -path "*/results*/*" | sort > headers.list

          echo "Discovered $(wc -l < headers.list | tr -d ' ') header(s):"
          awk '{print " - " $0}' headers.list

          mkdir -p runlogs

          # ---- Only verify on macOS ----
          DO_VERIFY=0
          if [ "${{ matrix.os }}" = "macos-14" ]; then
            DO_VERIFY=1
            # Choose results dir naming convention for macOS
            RESULTS_SUBDIR="results_macos"

            # Inline verification function, used only on macOS
            verify_folder() {
              local folder="$1"
              local results_dir="${folder%/}/${RESULTS_SUBDIR}"
              local status=0

              if [[ ! -d "$folder" ]]; then
                echo "VERIFY FAIL: missing folder: $folder"
                return 1
              fi
              if [[ ! -d "$results_dir" ]]; then
                echo "VERIFY FAIL: missing results dir: $results_dir"
                return 1
              fi

              shopt -s nullglob
              for file in "$folder"/*; do
                [[ -d "$file" ]] && continue
                [[ "$file" == *.log ]] && continue

                local rel; rel="$(basename "$file")"
                local candidate="${results_dir}/${rel}"

                [[ "$candidate" == *.bin ]] && continue

                if [[ ! -e "$candidate" ]]; then
                  echo "MISSING in results: $candidate"
                  status=1
                  continue
                fi

                if diff -q -- "$file" "$candidate" >/dev/null 2>&1; then
                  :
                else
                  echo "DIFF: $file <-> $candidate"
                  # Optional: show a unified diff for text files
                  diff -u --label "baseline:$(basename "$file")" --label "results:$(basename "$candidate")" -- "$file" "$candidate" || true
                  status=1
                fi
              done

              return "$status"
            }
          fi

          any_fail=0

          while IFS= read -r hdr; do
            [ -n "$hdr" ] || continue

            # Build a safe per-run log name from the relative header path
            rel="${hdr#${EXAMPLES_ROOT}/}"
            safe_log="run-${{ matrix.os }}-${rel//\//_}.log"

            echo "=== Running: ${EXECUTABLE_PATH} ${hdr}"
            if [ -n "${RUN_LAUNCHER}" ]; then
              echo "Launcher: ${RUN_LAUNCHER}"
              ${RUN_LAUNCHER} "${EXECUTABLE_PATH}" "${hdr}" 2>&1 | tee "runlogs/${safe_log}" || any_fail=1
            else
              "${EXECUTABLE_PATH}" "${hdr}" 2>&1 | tee "runlogs/${safe_log}" || any_fail=1
            fi

            if [ "$DO_VERIFY" -eq 1 ]; then
              exdir="$(dirname "$hdr")"
              echo "--- Verifying outputs in: $exdir"
              if verify_folder "$exdir"; then
                echo "VERIFY OK: $exdir"
              else
                echo "VERIFY FAIL: $exdir"
                any_fail=1
              fi
            else
              echo "--- Skipping verification on ${{ matrix.os }}"
            fi
          done < headers.list

          cp headers.list "runlogs/INDEX-headers-${{ matrix.os }}.txt"

          if [ "${any_fail}" -ne 0 ]; then
            echo "One or more runs or verifications failed. See runlogs/*.log and step output."
            exit 1
          fi      
      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}-${{ github.run_id }}
          path: |
            build-${{ matrix.os }}.log
            run-${{ matrix.os }}.log
            runlogs
